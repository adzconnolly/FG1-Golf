<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b5d2a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="FG1">
<title>FG1 Golf</title>
<style>
:root{--g:#12652f;--g2:#1f8b3e;--bg:#f3f6f3;--card:#fff;--ink:#132117;--muted:#68736b;--line:#dce3dd;--red:#a83232}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
#app{max-width:640px;margin:auto;min-height:100vh;padding-bottom:82px}.screen{padding:16px}
.top{position:sticky;top:0;z-index:5;background:linear-gradient(#0c5a28,#126832);color:white;padding:18px 16px 14px;text-align:center}
.top h1{font-size:21px;margin:0}.top small{opacity:.9}.hero{margin:18px 0;background:linear-gradient(180deg,#0d5b29,#174c2b);color:white;border-radius:28px;padding:34px 22px;text-align:center}
.logo{font-size:74px;font-weight:900;font-style:italic;letter-spacing:-6px}.logo span{color:#78c844}.tag{font-size:18px;line-height:1.45;margin:10px 0 24px}
.card{background:white;border:1px solid var(--line);border-radius:18px;padding:15px;margin:0 0 13px;box-shadow:0 5px 20px rgba(20,55,30,.06)}
.btn{border:0;border-radius:14px;background:#edf2ee;color:var(--ink);padding:14px 12px;min-height:50px;font-weight:800}.btn.primary{background:var(--g);color:white}.btn.outline{background:white;border:1.5px solid var(--g);color:var(--g)}.btn.active{background:var(--g2);color:white}.btn.danger{background:#fff1f1;color:var(--red)}.full{width:100%}
.grid{display:grid;gap:8px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g6{grid-template-columns:repeat(6,1fr)}
label,.label{font-size:12px;text-transform:uppercase;letter-spacing:.05em;font-weight:850;color:#33483a;display:block;margin:14px 0 7px}
input,select{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;background:white;font-size:16px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.muted{color:var(--muted)}.tiny{font-size:12px}
.tabs{display:flex;gap:6px;overflow:auto;margin-bottom:12px}.tabs .btn{min-width:84px;padding:9px;min-height:40px}
.metric{background:white;border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}.metric b{display:block;font-size:27px;color:var(--g)}.metric.total{background:var(--g);color:white}.metric.total b{color:white}
table{width:100%;border-collapse:collapse;font-size:12px}th,td{border-bottom:1px solid var(--line);padding:9px 5px;text-align:center}th{font-size:10px;text-transform:uppercase;color:var(--muted)}td.name,th.name{text-align:left;font-weight:800}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:640px;background:white;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:7px 8px calc(7px + env(safe-area-inset-bottom));z-index:7}.nav{border:0;background:none;padding:6px 2px;font-size:11px;color:#536057}.nav b{display:block;font-size:19px}.nav.on{color:var(--g);font-weight:800}
.notice{padding:10px 12px;border-radius:12px;background:#fff8df;border:1px solid #edd994;font-size:13px}
h2{margin:5px 0 15px}.bigTotal{font-size:56px;font-weight:900;color:var(--g);text-align:center}
</style>
</head>
<body><div id="app"></div>
<script>
(function(){
"use strict";
const PRESETS={
demo:{name:"FG1 Demo Golf Club",tee:"Demo",holes:[
[1,4,7],[2,4,13],[3,3,17],[4,5,5],[5,4,1],[6,5,9],[7,4,11],[8,3,15],[9,4,3],
[10,4,8],[11,4,14],[12,5,4],[13,3,18],[14,4,2],[15,5,10],[16,4,12],[17,3,16],[18,4,6]
]},
maidenheadYellow:{name:"The Maidenhead Golf Club – Mill Ride, Ascot",tee:"Yellow",holes:[
[1,5,13],[2,4,1],[3,3,11],[4,4,5],[5,5,3],[6,4,15],[7,4,9],[8,3,17],[9,4,7],
[10,5,6],[11,3,8],[12,4,12],[13,4,10],[14,4,2],[15,3,18],[16,4,16],[17,4,4],[18,5,14]
]}
};
function makeCourse(p){return p.holes.map(x=>({h:x[0],par:x[1],si:x[2]}))}
let COURSE=makeCourse(PRESETS.demo);
const fresh=()=>({view:"home",courseName:"FG1 Demo Golf Club",tee:"Demo",preset:"demo",players:[{name:"Player 1",hcp:18}],hole:1,pi:0,scores:{},started:false,activeRoundId:null,rounds:[]});
let S=fresh();
try{const old=localStorage.getItem("fg1_v4"); if(old) S=JSON.parse(old)}catch(e){S=fresh()}
if(!S.preset) S.preset="demo";
if(!Array.isArray(S.rounds)) S.rounds=[];
if(S.activeRoundId===undefined) S.activeRoundId=null;
if(S.preset && PRESETS[S.preset]) COURSE=makeCourse(PRESETS[S.preset]);
if(S.customCourse && Array.isArray(S.customCourse) && S.customCourse.length===18) COURSE=S.customCourse;
const save=()=>{try{localStorage.setItem("fg1_v4",JSON.stringify(S))}catch(e){}};
function roundSnapshot(status){
  return {
    id:S.activeRoundId||("r"+Date.now()),
    status:status||"in_progress",
    updatedAt:Date.now(),
    courseName:S.courseName,
    tee:S.tee||"",
    preset:S.preset||"custom",
    customCourse:S.customCourse||null,
    players:JSON.parse(JSON.stringify(S.players||[])),
    hole:S.hole||1,
    pi:S.pi||0,
    scores:JSON.parse(JSON.stringify(S.scores||{}))
  };
}
function saveActiveRound(status){
  if(!S.started && status!=="completed") return;
  const snap=roundSnapshot(status||"in_progress");
  S.activeRoundId=snap.id;
  const idx=S.rounds.findIndex(r=>r.id===snap.id);
  if(idx>=0) S.rounds[idx]=snap; else S.rounds.unshift(snap);
  S.rounds.sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
  S.rounds=S.rounds.slice(0,20);
}
function loadRound(r){
  S.activeRoundId=r.id;
  S.started=r.status!=="completed";
  S.courseName=r.courseName||"Imported Course";
  S.tee=r.tee||"";
  S.preset=r.preset||"custom";
  S.customCourse=r.customCourse||null;
  S.players=JSON.parse(JSON.stringify(r.players||[{name:"Player 1",hcp:18}]));
  S.hole=r.hole||1; S.pi=r.pi||0;
  S.scores=JSON.parse(JSON.stringify(r.scores||{}));
  if(S.customCourse&&S.customCourse.length===18) COURSE=S.customCourse;
  else if(PRESETS[S.preset]) COURSE=makeCourse(PRESETS[S.preset]);
  S.view=r.status==="completed"?"results":"play";
  save(); render();
}
const app=document.getElementById("app");
function scrollTopNow(){
  try{window.scrollTo({top:0,left:0,behavior:"smooth"})}catch(e){window.scrollTo(0,0)}
}
const key=(pi,h)=>pi+"_"+h;
function scoreRec(pi,h){
  if(!S.scores[key(pi,h)]) S.scores[key(pi,h)]={gross:null,fairway:null,green:null,putts:null,lost:0};
  const r=S.scores[key(pi,h)];
  if(r.lost==null) r.lost=0;
  return r;
}
function strokes(hcp,si){hcp=Math.max(0,Number(hcp)||0);return Math.floor(hcp/18)+(si<=hcp%18?1:0)}
function stbf(gross,par,shots){if(gross==null)return 0; return Math.max(0,2-(gross-shots-par))}
function fg(r,par){let p=0;if(par!==3&&r.fairway==="hit")p++;if(r.green==="gir")p++;if(par===5&&r.green==="in2")p+=2;if(+r.putts===1)p++;if(+r.putts>=3)p--;p-=(+r.lost||0);return p}
function calc(pi,h){const hole=COURSE[h-1],r=scoreRec(pi,h),sh=strokes(S.players[pi].hcp,hole.si),s=stbf(r.gross,hole.par,sh),f=fg(r,hole.par);return{hole,r,sh,s,f,total:s+f}}
function totals(pi,upto=18){
let gross=0,s=0,f=0,played=0,fw=0,fwO=0,gir=0,one=0,three=0,lost=0;
let fairPts=0,greenPts=0,puttPts=0,lostPts=0;
for(let h=1;h<=upto;h++){
 const c=calc(pi,h),r=c.r;
 if(r.gross!=null){gross+=+r.gross;s+=c.s;f+=c.f;played++}
 if(c.hole.par!==3&&r.fairway){fwO++;if(r.fairway==="hit"){fw++;fairPts++}}
 if(r.green==="gir"){gir++;greenPts++}
 if(r.green==="in2"){gir++;greenPts+=2}
 if(+r.putts===1){one++;puttPts++}
 if(+r.putts>=3){three++;puttPts--}
 lost+=+r.lost||0; lostPts-=(+r.lost||0)
}
return{gross,s,f,total:s+f,played,fw,fwO,gir,one,three,lost,fairPts,greenPts,puttPts,lostPts}
}
function top(t,sub){return `<div class="top"><h1>${t}</h1>${sub?`<small>${sub}</small>`:""}</div>`}
function nav(on){return `<div class="bottom"><button class="nav ${on==="score"?"on":""}" onclick="FG.go('play')"><b>⚑</b>Score</button><button class="nav ${on==="leader"?"on":""}" onclick="FG.go('leader')"><b>🏆</b>Leaderboard</button><button class="nav ${on==="card"?"on":""}" onclick="FG.go('card')"><b>▦</b>Scorecard</button><button class="nav" onclick="FG.go('home')"><b>•••</b>Home</button></div>`}
function render(){
  const v=S.view;
  if(v==="home") return home();
  if(v==="setup") return setup();
  if(v==="players") return players();
  if(v==="play") return play();
  if(v==="leader") return leader();
  if(v==="card") return card();
  if(v==="results") return results();
  if(v==="reviewCourse") return reviewCourse();
  home();
}
function home(){
  if(S.started) saveActiveRound("in_progress");
  const recent=(S.rounds||[]).slice().sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0)).slice(0,6);
  const active=recent.find(r=>r.id===S.activeRoundId&&r.status==="in_progress");
  app.innerHTML=`<div class="screen"><div class="hero"><div class="logo">FG<span>1</span></div><div>Fairways · Greens · 1 Putts</div><div class="tag">Every fairway.<br>Every green.<br>Every putt matters.</div>
  ${active?`<button class="btn primary full" onclick="FG.resume('${active.id}')">RESUME ROUND · HOLE ${active.hole}</button><div style="height:8px"></div>`:""}
  <button class="btn ${active?"outline":"primary"} full" onclick="FG.newRound()">PLAY NEW FG1 ROUND</button></div>
  <div class="card"><b>Recent rounds</b><div class="muted tiny">Your last 6 rounds are stored on this device.</div></div>
  ${recent.length?recent.map(r=>{
    const label=r.status==="completed"?"Completed":"In progress";
    const player=(r.players&&r.players[0])?r.players[0].name:"Player";
    const date=new Date(r.updatedAt||Date.now()).toLocaleDateString();
    let t={s:0,f:0,total:0};
    try{
      const oldCourse=COURSE, oldS=S;
    }catch(e){}
    return `<div class="card"><div class="row"><div style="min-width:0"><b>${r.courseName||"FG1 Round"}</b><div class="tiny muted">${date} · ${player} · ${label}${r.status==="in_progress"?` · Hole ${r.hole}`:""}</div></div><div style="display:flex;gap:6px;flex-shrink:0"><button class="btn outline" onclick="FG.resume('${r.id}')">${r.status==="completed"?"VIEW":"CONTINUE"}</button><button class="btn danger" onclick="FG.deleteRound('${r.id}')">DELETE</button></div></div></div>`;
  }).join(""):`<div class="card muted">No saved rounds yet.</div>`}
  </div>`;
}
function setup(){app.innerHTML=top("Start a Round")+`<div class="screen">
<div class="card">
<label>Course</label>
<select onchange="FG.preset(this.value)">
<option value="demo" ${S.preset==="demo"?"selected":""}>FG1 Demo Golf Club</option>
<option value="maidenheadYellow" ${S.preset==="maidenheadYellow"?"selected":""}>Maidenhead Golf Club – Mill Ride, Ascot (Yellow)</option>
<option value="custom" ${S.preset==="custom"?"selected":""}>Imported / Custom Course</option>
</select>
<div class="tiny muted" style="margin-top:8px">${S.courseName}${S.tee?` · ${S.tee} tees`:""}</div>

<div class="label">Import a scorecard</div>
<input id="scorecardPhoto" type="file" accept="image/*" capture="environment" onchange="FG.readScorecard(this)" style="padding:10px">
<div id="ocrStatus" class="tiny muted" style="margin-top:8px">Take a photo or choose a clear scorecard image. The app will try to read Par and Stroke Index and then show a review screen.</div>

<div class="label">Round</div>
<div class="notice">18-hole FG1 round. Playing Handicap is used to allocate Stableford strokes by Stroke Index.</div>
</div>
<button class="btn primary full" onclick="FG.go('players')">NEXT — PLAYERS</button>
</div>`}
function players(){app.innerHTML=top("Who's Playing?")+`<div class="screen">${S.players.map((p,i)=>`<div class="card row"><div><b>${p.name}</b><div class="tiny muted">Playing Handicap ${p.hcp}</div></div><div style="display:flex;gap:6px;flex-shrink:0"><button class="btn outline" onclick="FG.editP(${i})">EDIT</button>${S.players.length>1?`<button class="btn danger" onclick="FG.removeP(${i})">REMOVE</button>`:""}</div></div>`).join("")}${S.players.length<4?`<button class="btn outline full" onclick="FG.addP()">+ ADD PLAYER</button><br><br>`:""}<button class="btn primary full" onclick="FG.start()">START ROUND</button></div>`}
function play(){
 if(!S.started){S.view="setup";save();return render()}
 const h=S.hole,pi=S.pi,c=calc(pi,h),r=c.r,par=c.hole.par;
 const scoreOpts=par===3?[2,3,4,5,6]:par===4?[3,4,5,6,7,8]:[3,4,5,6,7,8];
 const done=r.gross!=null&&r.green&&r.putts!=null&&(par===3||r.fairway);
 app.innerHTML=top(`HOLE ${h} OF 18`,`PAR ${par} · SI ${c.hole.si} · ${c.sh} handicap stroke${c.sh===1?"":"s"}`)+`<div class="screen">
 <div class="row" style="margin-bottom:12px"><button class="btn outline" onclick="FG.prevHole()" ${h===1?"disabled":""}>← PREVIOUS</button><span class="tiny muted">Hole ${h}</span><button class="btn outline" onclick="FG.nextHole()" ${h===18?"disabled":""}>NEXT →</button></div>
 <div class="tabs">${S.players.map((p,i)=>`<button class="btn ${i===pi?"active":""}" onclick="FG.pi(${i})">${p.name} (${p.hcp})</button>`).join("")}</div>
 <div class="label">Gross score</div><div class="grid g6">${scoreOpts.map(v=>`<button class="btn ${r.gross===v?"active":""}" onclick="FG.set('gross',${v})">${v}${v===8?"+":""}</button>`).join("")}</div>
 ${par===3?"":`<div class="label">Fairway</div><div class="grid g2"><button class="btn ${r.fairway==="hit"?"active":""}" onclick="FG.set('fairway','hit')">✓ HIT +1</button><button class="btn ${r.fairway==="miss"?"active":""}" onclick="FG.set('fairway','miss')">✕ MISS</button></div>`}
 <div class="label">Green</div>${par===5?`<div class="grid g3"><button class="btn ${r.green==="in2"?"active":""}" onclick="FG.set('green','in2')">★ IN 2 +2</button><button class="btn ${r.green==="gir"?"active":""}" onclick="FG.set('green','gir')">✓ GIR +1</button><button class="btn ${r.green==="miss"?"active":""}" onclick="FG.set('green','miss')">✕ MISS</button></div>`:`<div class="grid g2"><button class="btn ${r.green==="gir"?"active":""}" onclick="FG.set('green','gir')">✓ GIR +1</button><button class="btn ${r.green==="miss"?"active":""}" onclick="FG.set('green','miss')">✕ MISS</button></div>`}
 <div class="label">Putts</div><div class="grid g4">${[1,2,3,4].map(v=>`<button class="btn ${+r.putts===v?"active":""}" onclick="FG.set('putts',${v})">${v}${v===4?"+":""}</button>`).join("")}</div>
 <div class="label">Lost balls</div><div class="grid g4">${[0,1,2,3].map(v=>`<button class="btn ${+r.lost===v?"active":""}" onclick="FG.set('lost',${v})">${v}${v===3?"+":""}${v?` (−${v})`:""}</button>`).join("")}</div>
 <div style="height:14px"></div><div class="grid g4"><div class="metric">Gross<b>${r.gross??"–"}</b></div><div class="metric">Stbf<b>${r.gross!=null?c.s:"–"}</b></div><div class="metric">FG1<b>${done?c.f:"–"}</b></div><div class="metric total">Total<b>${done?c.total:"–"}</b></div></div>
 <div style="height:14px"></div>${done?`<button class="btn primary full" onclick="FG.next()">${pi<S.players.length-1?"NEXT PLAYER →":h<18?"COMPLETE HOLE →":"FINISH ROUND"}</button>`:`<div class="notice">Complete the score, ${par===3?"":"fairway, "}green and putts.</div>`}</div>${nav("score")}`}
function leader(){
const a=S.players.map((p,i)=>({p,t:totals(i,S.hole)})).sort((x,y)=>y.t.total-x.t.total);
app.innerHTML=top("FG1 LIVE",`Through hole ${S.hole}`)+`<div class="screen">
${a.map((x,i)=>`<div class="card">
<div class="row"><div><b>${i+1}. ${x.p.name}</b><div class="tiny muted">${x.t.s} Stableford + ${x.t.f} FG1</div></div><div style="font-size:30px;font-weight:900;color:var(--g)">${x.t.total}</div></div>
<div class="grid g4" style="margin-top:12px">
<div class="metric"><span>Fairways</span><b>${x.t.fairPts}</b></div>
<div class="metric"><span>Greens</span><b>${x.t.greenPts}</b></div>
<div class="metric"><span>Putting</span><b>${x.t.puttPts}</b></div>
<div class="metric"><span>Lost</span><b>${x.t.lostPts}</b></div>
</div>
<div class="tiny muted" style="margin-top:8px">FG1 breakdown: F ${x.t.fairPts} · G ${x.t.greenPts} · P ${x.t.puttPts} · Lost ${x.t.lostPts}</div>
</div>`).join("")}
</div>${nav("leader")}`}
function card(){
  const playerCards=S.players.map((p,pi)=>{
    const t=totals(pi,18);
    const rows=COURSE.map(h=>{
      const c=calc(pi,h.h),r=c.r;
      const fairPts=(h.par!==3&&r.fairway==="hit")?1:0;
      const greenPts=r.green==="in2"?2:(r.green==="gir"?1:0);
      const puttPts=(+r.putts===1)?1:((+r.putts>=3)?-1:0);
      const lostPts=-(+r.lost||0);
      return `<tr onclick="FG.jumpPlayer(${pi},${h.h})">
        <td>${h.h}</td>
        <td>${h.par}</td>
        <td>${r.gross??"–"}</td>
        <td>${r.gross!=null?c.s:"–"}</td>
        <td>${fairPts||"–"}</td>
        <td>${greenPts||"–"}</td>
        <td>${puttPts||"–"}</td>
        <td>${lostPts||"–"}</td>
        <td>${r.gross!=null?c.f:"–"}</td>
        <td><b>${r.gross!=null?c.total:"–"}</b></td>
      </tr>`;
    }).join("");
    return `<div class="card">
      <div class="row"><div><h2 style="margin:0">${p.name} (${p.hcp})</h2><div class="tiny muted">Playing Handicap ${p.hcp}</div></div><div style="font-size:28px;font-weight:900;color:var(--g)">${t.total}</div></div>
      <div class="grid g4" style="margin-top:12px">
        <div class="metric"><span>Stbf</span><b>${t.s}</b></div>
        <div class="metric"><span>FG1</span><b>${t.f}</b></div>
        <div class="metric"><span>Gross</span><b>${t.gross||"–"}</b></div>
        <div class="metric total"><span>Total</span><b>${t.total}</b></div>
      </div>
      <div class="grid g4" style="margin-top:8px">
        <div class="metric"><span>Fairways</span><b>${t.fairPts}</b></div>
        <div class="metric"><span>Greens</span><b>${t.greenPts}</b></div>
        <div class="metric"><span>Putting</span><b>${t.puttPts}</b></div>
        <div class="metric"><span>Lost</span><b>${t.lostPts}</b></div>
      </div>
      <div class="tiny muted" style="margin:10px 0">Tap any hole to edit that player’s score.</div>
      <div style="overflow:auto">
        <table>
          <thead><tr><th>H</th><th>Par</th><th>Gross</th><th>Stbf</th><th>F</th><th>G</th><th>P</th><th>Lost</th><th>FG1</th><th>Total</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>`;
  }).join("");
  app.innerHTML=top("Scorecards","All players")+`<div class="screen">${playerCards}</div>${nav("card")}`;
}
function results(){app.innerHTML=top("ROUND COMPLETE",S.courseName)+`<div class="screen">${S.players.map((p,i)=>{const t=totals(i);return `<div class="card"><h2>${p.name}</h2><div class="grid g4"><div class="metric">Gross<b>${t.gross}</b></div><div class="metric">Stbf<b>${t.s}</b></div><div class="metric">FG1<b>${t.f}</b></div><div class="metric total">Total<b>${t.total}</b></div></div><p class="muted tiny">Lost balls: ${t.lost} · Fairways: ${t.fw}/${t.fwO} · GIR: ${t.gir}/18</p></div>`}).join("")}<button class="btn outline full" onclick="FG.done()">DONE</button></div>`}
window.FG={
 go(v){
   if(S.started) saveActiveRound("in_progress");
   S.view=v;save();render()
 },
 newRound(){
   if(S.started) saveActiveRound("in_progress");
   S.view="setup";save();render()
 },
 resume(id){
   const r=(S.rounds||[]).find(x=>x.id===id);
   if(r) loadRound(r)
 },
 deleteRound(id){
   const r=(S.rounds||[]).find(x=>x.id===id);
   if(!r) return;
   const label=r.courseName||"this round";
   if(confirm("Delete "+label+"? This cannot be undone.")){
     S.rounds=S.rounds.filter(x=>x.id!==id);
     if(S.activeRoundId===id){S.activeRoundId=null;S.started=false;}
     save();render();
   }
 },
 jumpPlayer(pi,h){
   if(S.started) saveActiveRound("in_progress");
   S.pi=pi;S.hole=h;S.view="play";
   save();render();setTimeout(scrollTopNow,0)
 },
 prevHole(){
   if(S.hole>1){saveActiveRound("in_progress");S.hole--;save();render();setTimeout(scrollTopNow,0)}
 },
 nextHole(){
   if(S.hole<18){saveActiveRound("in_progress");S.hole++;save();render();setTimeout(scrollTopNow,0)}
 },
 course(v){S.courseName=v;save()},
 preset(v){
   if(v==="custom"){S.preset="custom";save();render();return}
   const p=PRESETS[v]; if(!p)return;
   S.preset=v; S.courseName=p.name; S.tee=p.tee; S.customCourse=null; COURSE=makeCourse(p); save(); render();
 },
 async readScorecard(input){
   const file=input.files&&input.files[0]; if(!file)return;
   const status=document.getElementById("ocrStatus"); if(status) status.textContent="Reading scorecard… this can take 20–60 seconds.";
   try{
     if(!window.Tesseract){
       await new Promise((resolve,reject)=>{
         const s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";s.onload=resolve;s.onerror=reject;document.head.appendChild(s);
       });
     }
     const result=await Tesseract.recognize(file,"eng",{logger:m=>{if(status&&m.status)status.textContent=m.status+" "+(m.progress?Math.round(m.progress*100)+"%":"")}});
     const text=result.data.text||"";
     const parsed=FG.parseScorecard(text);
     if(!parsed){ if(status)status.textContent="I couldn't reliably read 18 holes. Try a straighter, brighter photo, or use the review table after selecting a preset."; return; }
     S.pendingCourse=parsed; S.pendingCourseName="Imported Scorecard"; S.view="reviewCourse"; save(); render();
   }catch(e){ if(status)status.textContent="Scorecard reading failed on this image. Try another photo."; }
 },
 parseScorecard(text){
   const nums=(text.match(/\b\d{1,3}\b/g)||[]).map(Number);
   // Heuristic: find a run containing 18 par values (3–5) and 18 unique SI values (1–18).
   // Works best on scorecards whose Par and SI rows are printed horizontally.
   for(let i=0;i<nums.length;i++){
     const pars=nums.slice(i,i+18);
     if(pars.length===18&&pars.every(n=>n>=3&&n<=5)){
       for(let j=i+18;j<Math.min(nums.length-17,i+90);j++){
         const sis=nums.slice(j,j+18);
         if(sis.length===18&&sis.every(n=>n>=1&&n<=18)&&new Set(sis).size>=15){
           return pars.map((p,k)=>({h:k+1,par:p,si:sis[k]}));
         }
       }
     }
   }
   return null;
 },
 editImported(i,f,v){if(!S.pendingCourse)return;S.pendingCourse[i][f]=+v;save()},
 applyImported(){
   if(!S.pendingCourse||S.pendingCourse.length!==18)return;
   COURSE=S.pendingCourse.map((h,i)=>({h:i+1,par:+h.par,si:+h.si}));
   S.customCourse=COURSE; S.courseName=S.pendingCourseName||"Imported Course"; S.tee="Imported"; S.preset="custom"; S.view="players"; save(); render();
 },
 addP(){if(S.players.length<4){S.players.push({name:"Player "+(S.players.length+1),hcp:18});save();render()}},
 removeP(i){
   if(S.players.length<=1) return;
   const name=S.players[i]?.name||"this player";
   if(confirm("Remove "+name+" from this round?")){
     S.players.splice(i,1);
     if(S.pi>=S.players.length) S.pi=S.players.length-1;
     save();render();
   }
 },
 editP(i){const n=prompt("Player name",S.players[i].name);if(n===null)return;const h=prompt("Playing Handicap",S.players[i].hcp);if(h===null)return;S.players[i]={name:n||"Player",hcp:Math.max(0,+h||0)};save();render()},
 start(){
   if(S.started) saveActiveRound("in_progress");
   S.activeRoundId="r"+Date.now();
   S.hole=1;S.pi=0;S.scores={};S.started=true;S.view="play";
   saveActiveRound("in_progress");save();render()
 },
 pi(i){S.pi=i;saveActiveRound("in_progress");save();render();setTimeout(scrollTopNow,0)},
 set(f,v){scoreRec(S.pi,S.hole)[f]=v;saveActiveRound("in_progress");save();render()},
 next(){
   if(S.pi<S.players.length-1) S.pi++;
   else if(S.hole<18){S.hole++;S.pi=0}
   else{S.view="results";saveActiveRound("completed");S.started=false}
   if(S.started) saveActiveRound("in_progress");
   save();render();setTimeout(scrollTopNow,0)
 },
 jump(h){if(S.started)saveActiveRound("in_progress");S.hole=h;S.view="play";save();render();setTimeout(scrollTopNow,0)},
 done(){S.started=false;S.activeRoundId=null;S.view="home";save();render()}
};
render();
})();
</script>
